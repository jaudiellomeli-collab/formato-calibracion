# La carpeta del formato de calibracion dentro del sitio de nginx del servidor.
# La instala scripts/servidor-ubuntu.sh en /etc/nginx/snippets/formato-calibracion.conf,
# cambiando RUTA (p. ej. /formato-calibracion) y PUERTO, y la incluye en el
# bloque `server` del dominio: el del Validador si ya existe, o uno propio
# (deploy/nginx/formato.conf) si no.
#
# El contenedor se publica solo en 127.0.0.1 (FORMATO_PUBLICAR en .env): nginx
# es la unica entrada desde la red.

location = RUTA {
    return 301 RUTA/;
}

# ^~ para que ninguna location con expresion regular del mismo sitio se quede
# con los .js y .png de Streamlit.
location ^~ RUTA/ {
    # Sin URI despues del puerto: la carpeta llega completa a Streamlit, que la
    # conoce por STREAMLIT_SERVER_BASE_URL_PATH.
    proxy_pass http://127.0.0.1:PUERTO;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit habla con el navegador por WebSocket (_stcore/stream). Sin
    # estas dos cabeceras la pagina se queda en "Please wait...".
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # La conexion queda abierta mientras alguien llena el formato; con el
    # minuto por omision nginx la cortaria y se perderia lo capturado.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;

    # Fotos del servicio (STREAMLIT_SERVER_MAX_UPLOAD_SIZE=50 en el Dockerfile).
    client_max_body_size 50m;
}
