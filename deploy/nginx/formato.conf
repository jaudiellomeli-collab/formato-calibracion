# Sitio propio de nginx para el formato de calibracion. Solo se usa si en el
# servidor no hay ya un sitio para el dominio (el del Validador): en ese caso
# scripts/servidor-ubuntu.sh agrega la carpeta del formato a ese sitio, porque
# nginx no admite dos bloques `server` con el mismo nombre.
#
# El script cambia DOMINIO por el nombre real; certbot --nginx agrega despues
# el certificado, el bloque 443 y la redireccion de 80 a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    include snippets/formato-calibracion.conf;
}
